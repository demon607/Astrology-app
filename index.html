<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroCosm — Enter Your Birth Details</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="phone-container">

    <header class="app-header">
      <div class="app-logo">
        <span>✨</span> ASTROCOSM
      </div>
    </header>

    <main class="app-content" id="main-content-scroll">
      <section class="app-view onboarding-screen active">
        <div class="cosmic-title">AstroCosm</div>
        <div class="cosmic-subtitle">Enter your birth details to reveal your celestial blueprint and unlock personalized readings.</div>

        <form id="onboarding-form" style="width: 100%;">
          <div class="form-group">
            <label for="ob-name">Your Cosmic Name</label>
            <input type="text" id="ob-name" class="cosmic-input" placeholder="e.g. Selena" required>
          </div>

          <div class="row-group">
            <div class="form-group" style="flex: 2;">
              <label for="ob-date">Birth Date</label>
              <input type="date" id="ob-date" class="cosmic-input" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="ob-time">Birth Time</label>
              <input type="time" id="ob-time" class="cosmic-input" value="12:00" required>
            </div>
          </div>

          <div class="form-group">
            <label for="ob-city">Birth City Preset</label>
            <select id="ob-city" class="cosmic-input" style="background: #111128;">
              <option value="custom">-- Custom Coordinates --</option>
              <option value="newyork" selected>New York, USA (-5h, 74°W, 40°N)</option>
              <option value="london">London, UK (0h, 0°W, 51°N)</option>
              <option value="tokyo">Tokyo, Japan (+9h, 139°E, 35°N)</option>
              <option value="mumbai">Mumbai, India (+5.5h, 72°E, 19°N)</option>
              <option value="sydney">Sydney, Australia (+10h, 151°E, 33°S)</option>
            </select>
          </div>

          <div class="row-group" id="custom-coords-row" style="display: none;">
            <div class="form-group">
              <label for="ob-lon">Longitude (deg)</label>
              <input type="number" step="any" id="ob-lon" class="cosmic-input" value="-74.0">
            </div>
            <div class="form-group">
              <label for="ob-lat">Latitude (deg)</label>
              <input type="number" step="any" id="ob-lat" class="cosmic-input" value="40.7">
            </div>
            <div class="form-group">
              <label for="ob-tz">Timezone (GMT Offset)</label>
              <input type="number" step="any" id="ob-tz" class="cosmic-input" value="-5">
            </div>
          </div>

          <button type="submit" class="cosmic-button">Cast Birth Chart</button>
        </form>
      </section>
    </main>

    <!-- No navbar on onboarding -->

  </div>

  <script src="js/astrology.js"></script>
  <script src="js/data.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
