<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroCosm — Tarot</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="phone-container">

    <header class="app-header">
      <div class="app-logo"><span>✨</span> ASTROCOSM</div>
      <div class="user-quick-profile" id="header-profile-btn">
        <span id="header-user-sign">♈</span>
        <span id="header-user-name">User</span>
      </div>
    </header>

    <main class="app-content" id="main-content-scroll">
      <section class="app-view active">

        <div class="dashboard-hero" style="padding-bottom: 5px;">
          <div class="zodiac-badge-large" style="font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(135deg, var(--color-nebula-violet) 0%, var(--color-nebula-purple) 100%);">🔮</div>
          <h2 class="cosmic-title" style="font-size: 1.6rem;">Cosmic Tarot</h2>
          <p class="cosmic-subtitle" style="font-size: 0.85rem; margin-bottom: 10px; padding: 0 15px;">Draw Major Arcana cards aligned with your celestial blueprint.</p>
        </div>

        <div class="tab-container" style="margin-bottom: 15px;">
          <button class="tab-btn active" id="tarot-mode-daily" data-tarot-mode="daily">Daily Guidance</button>
          <button class="tab-btn" id="tarot-mode-three" data-tarot-mode="three-card">3-Card Spread</button>
        </div>

        <div class="tarot-board-wrapper">
          <div class="tarot-card-deck" id="tarot-deck"></div>
        </div>

        <div class="tarot-slots-label" id="tarot-slots-container" style="display: none;">
          <div class="tarot-slot-title">Past</div>
          <div class="tarot-slot-title">Present</div>
          <div class="tarot-slot-title">Future</div>
        </div>

        <div class="glass-card gold-border tarot-reading-card" id="tarot-reading-panel" style="display: none;">
          <h3 class="cosmic-title" style="font-size: 1.2rem; margin-bottom: 15px; text-align: center;" id="tarot-reading-title">Your Reading</h3>
          <div id="tarot-reading-results-list"></div>
          <button class="cosmic-button" id="tarot-reset-btn" style="margin-top: 20px;">Clear and Shuffle Deck</button>
        </div>

      </section>
    </main>

    <nav class="app-navbar" id="app-navbar"></nav>
  </div>

  <script src="js/astrology.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tarot.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/tarot-screen.js"></script>
</body>
</html>
