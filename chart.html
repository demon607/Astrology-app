<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroCosm — Birth Chart</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="phone-container">

    <header class="app-header">
      <div class="app-logo"><span>✨</span> ASTROCOSM</div>
      <div class="user-quick-profile" id="header-profile-btn">
        <span id="header-user-sign">♈</span>
        <span id="header-user-name">User</span>
      </div>
    </header>

    <main class="app-content" id="main-content-scroll">
      <section class="app-view active">

        <div class="chart-container-wrapper">
          <div id="chart-svg-container" style="width: 100%; display: flex; justify-content: center;"></div>
        </div>

        <div class="chart-details-panel">
          <div class="chart-section-title">Your Placements</div>
          <div class="placement-list" id="chart-placements-list"></div>
        </div>

      </section>
    </main>

    <!-- Placement Detail Modal -->
    <div class="cosmic-modal" id="placement-modal">
      <div class="modal-content">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <div class="modal-header-symbol" id="modal-symbol">☉</div>
        <h4 class="modal-title" id="modal-title">Sun in Aries</h4>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <nav class="app-navbar" id="app-navbar"></nav>
  </div>

  <script src="js/astrology.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chart-screen.js"></script>
</body>
</html>
