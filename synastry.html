<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroCosm — Synastry</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="phone-container">

    <header class="app-header">
      <div class="app-logo"><span>✨</span> ASTROCOSM</div>
      <div class="user-quick-profile" id="header-profile-btn">
        <span id="header-user-sign">♈</span>
        <span id="header-user-name">User</span>
      </div>
    </header>

    <main class="app-content" id="main-content-scroll">
      <section class="app-view compatibility-screen active">

        <!-- Setup Form -->
        <div id="comp-setup-card" class="glass-card gold-border" style="margin-top: 20px;">
          <h3 class="cosmic-title" style="font-size: 1.3rem; margin-bottom: 10px;">Compare Charts</h3>
          <p class="cosmic-subtitle" style="font-size: 0.85rem; margin-bottom: 20px;">Enter your partner's birth details to compute a synastry compatibility score and detail aspects.</p>

          <form id="compatibility-form">
            <div class="form-group">
              <label for="comp-name">Partner's Name</label>
              <input type="text" id="comp-name" class="cosmic-input" placeholder="e.g. Leo" required>
            </div>
            <div class="row-group">
              <div class="form-group" style="flex: 2;">
                <label for="comp-date">Birth Date</label>
                <input type="date" id="comp-date" class="cosmic-input" required>
              </div>
              <div class="form-group" style="flex: 1;">
                <label for="comp-time">Birth Time</label>
                <input type="time" id="comp-time" class="cosmic-input" value="12:00" required>
              </div>
            </div>

            <div class="form-group">
              <label for="comp-city">Birth City Preset</label>
              <select id="comp-city" class="cosmic-input" style="background: #111128;">
                <option value="custom">-- Custom Coordinates --</option>
                <option value="newyork">New York, USA (-5h, 74°W, 40°N)</option>
                <option value="london" selected>London, UK (0h, 0°W, 51°N)</option>
                <option value="tokyo">Tokyo, Japan (+9h, 139°E, 35°N)</option>
                <option value="mumbai">Mumbai, India (+5.5h, 72°E, 19°N)</option>
                <option value="sydney">Sydney, Australia (+10h, 151°E, 33°S)</option>
              </select>
            </div>

            <div class="row-group" id="comp-coords-row" style="display: none;">
              <div class="form-group">
                <label for="comp-lon">Longitude (deg)</label>
                <input type="number" step="any" id="comp-lon" class="cosmic-input" value="0.0">
              </div>
              <div class="form-group">
                <label for="comp-lat">Latitude (deg)</label>
                <input type="number" step="any" id="comp-lat" class="cosmic-input" value="51.5">
              </div>
              <div class="form-group">
                <label for="comp-tz">Timezone (GMT Offset)</label>
                <input type="number" step="any" id="comp-tz" class="cosmic-input" value="0">
              </div>
            </div>

            <button type="submit" class="cosmic-button">Calculate Synastry</button>
          </form>
        </div>

        <!-- Results -->
        <div id="comp-results-view" style="display: none;">
          <div class="comp-header">
            <h3 class="cosmic-title" style="font-size: 1.5rem;" id="comp-title-names">— & —</h3>
            <div class="comp-avatars">
              <div class="comp-avatar-circle gold" id="comp-my-avatar">♈</div>
              <div class="comp-connection-heart">❤️</div>
              <div class="comp-avatar-circle" id="comp-partner-avatar">♌</div>
            </div>
          </div>

          <div class="comp-score-ring">
            <svg width="140" height="140">
              <circle cx="70" cy="70" r="60" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="8"></circle>
              <circle cx="70" cy="70" r="60" fill="transparent" stroke="url(#scoreGrad)" stroke-width="8"
                      stroke-dasharray="377" stroke-dashoffset="377" class="svg-ring-circle" id="comp-score-circle"></circle>
              <defs>
                <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="var(--color-nebula-purple)"></stop>
                  <stop offset="100%" stop-color="var(--color-gold-glow)"></stop>
                </linearGradient>
              </defs>
            </svg>
            <div class="comp-score-text">
              <span class="comp-score-percent" id="comp-score-pct">0%</span>
              <span class="comp-score-label">Match</span>
            </div>
          </div>

          <div class="glass-card" style="margin-top: 0; padding: 15px;">
            <div class="horoscope-dimensions" style="margin-top: 0;">
              <div class="dimension-row">
                <span class="dimension-label">💖 Romance</span>
                <div class="dimension-bar-bg">
                  <div class="dimension-bar-fill" id="bar-comp-love" style="width: 0%;"></div>
                </div>
                <span class="dimension-value" id="val-comp-love">0%</span>
              </div>
              <div class="dimension-row">
                <span class="dimension-label">🧠 Mind</span>
                <div class="dimension-bar-bg">
                  <div class="dimension-bar-fill" id="bar-comp-mind" style="width: 0%;"></div>
                </div>
                <span class="dimension-value" id="val-comp-mind">0%</span>
              </div>
              <div class="dimension-row">
                <span class="dimension-label">🌌 Spirit</span>
                <div class="dimension-bar-bg">
                  <div class="dimension-bar-fill" id="bar-comp-spirit" style="width: 0%;"></div>
                </div>
                <span class="dimension-value" id="val-comp-spirit">0%</span>
              </div>
            </div>
          </div>

          <div class="chart-section-title">Celestial Aspects</div>
          <div class="placement-list" id="comp-aspects-list" style="margin-bottom: 20px;"></div>

          <div style="padding: 0 15px 15px;">
            <button class="cosmic-button" id="comp-recalculate-btn" style="background: transparent; border: 1px solid var(--glass-border); color: var(--color-starlight); box-shadow: none;">Match Another Profile</button>
          </div>
        </div>

      </section>
    </main>

    <!-- Aspect Detail Modal -->
    <div class="cosmic-modal" id="placement-modal">
      <div class="modal-content">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <div class="modal-header-symbol" id="modal-symbol">❤️</div>
        <h4 class="modal-title" id="modal-title">Aspect</h4>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <nav class="app-navbar" id="app-navbar"></nav>
  </div>

  <script src="js/astrology.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/synastry.js"></script>
</body>
</html>
